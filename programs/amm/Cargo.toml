[package]
name = "xmrvm-amm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Constant-product automated market maker for XMR units against an application token"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2.1"
spl-token = { version = "7", features = ["no-entrypoint"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
